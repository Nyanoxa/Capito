<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAPITO — Бронирование</title>

    <link rel="stylesheet" href="booking.css">
</head>

<body>

    <main class="booking-page">

    
        <header class="booking-header">

            <a href="index.html" class="booking-logo">
                CAPITO
            </a>

            <a href="index.html" class="booking-back">
                ← Главная
            </a>

        </header>


    
        <section class="booking">

        
            <div class="booking-intro">

                <span class="booking-label">
                    CAPITO COFFEE BAR
                </span>

                <h1>
                    Забронировать
                </h1>

                <p>
                    Выберите удобный филиал, дату и время,
                    чтобы провести время в CAPITO.
                </p>

            </div>


        
            <form class="booking-form">

            
                <div class="form-group">

                    <label for="name">
                        Имя
                    </label>

                    <input type="text" id="name" name="name" placeholder="Ваше имя" autocomplete="name" required>

                </div>


        
                <div class="form-group">

                    <label for="branch">
                        Филиал
                    </label>

                    <select id="branch" name="branch" required>

                        <option value="" disabled selected>
                            Выберите филиал
                        </option>

                        <option value="Байтик Баатыра, 1/4">
                            Байтик Баатыра, 1/4
                        </option>

                        <option value="Боконбаева, 103">
                            Боконбаева, 103
                        </option>

                        <option value="Токомбаева, 23/9">
                            Токомбаева, 23/9
                        </option>

                        <option value="Токомбаева, 43Б">
                            Токомбаева, 43Б
                        </option>

                        <option value="Турусбекова, 100">
                            Турусбекова, 100
                        </option>

                        <option value="Манаса, 49">
                            Манаса, 49
                        </option>

                        <option value="Тыналиева, 1/3">
                            Тыналиева, 1/3
                        </option>

                        <option value="Исанова, 41">
                            Исанова, 41
                        </option>

                        <option value="Абдумомунова, 221">
                            Абдумомунова, 221
                        </option>

                        <option value="Киевская, 148">
                            Киевская, 148
                        </option>

                        <option value="Горького, 1/2">
                            Горького, 1/2
                        </option>

                        <option value="Фрунзе, 282а">
                            Фрунзе, 282а
                        </option>

                        <option value="Чынгыза Айтматова, 3">
                            Чынгыза Айтматова, 3
                        </option>

                    </select>

                </div>


            
                <div class="form-row">

                    <div class="form-group">

                        <label for="date">
                            Дата
                        </label>

                        <input type="date" id="date" name="date" required>

                    </div>


                    <div class="form-group">

                        <label for="time">
                            Время
                        </label>

                        <input type="time" id="time" name="time" required>

                    </div>

                </div>


    
                <div class="form-group">

                    <label for="guests">
                        Количество гостей
                    </label>

                    <input type="number" id="guests" name="guests" placeholder="Введите количество гостей" min="1"
                        max="50" inputmode="numeric" required>

                </div>


             
                <div class="form-group">

                    <label for="phone">
                        Телефон
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="+996 ___ ___ ___" autocomplete="tel"
                        inputmode="tel" required>

                </div>


    
                <div class="form-group">

                    <label for="comment">
                        Комментарий
                    </label>

                    <textarea id="comment" name="comment" placeholder="Дополнительные пожелания" rows="4"></textarea>

                </div>


            
                <button type="submit" class="booking-button">
                    Забронировать
                </button>

            </form>

        </section>


        <footer class="booking-footer">

            <span class="booking-footer-logo">
                CAPITO
            </span>

            <p>
                Место, где вкус становится впечатлением.
            </p>

        </footer>

    </main>


    <script>

        const form = document.querySelector(".booking-form");

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const branch = document.querySelector("#branch").value;

            alert(
                "Спасибо! Ваша заявка на бронирование отправлена.\n\n" +
                "Филиал: " + branch
            );

            form.reset();

        });

    </script>

</body>

</html>
